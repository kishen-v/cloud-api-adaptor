#IBMCLOUD_API_KEY="" # Can either be set here or be injected as an environment variable.
POWERVS_NETWORK_NAME=""
POWERVS_ZONE=""
POWERVS_REGION=""
POWERVS_SERVICE_INSTANCE_ID=""
POWERVS_IMAGE_ID=""    # Peer-pod VM image ID in the PowerVS workspace
POWERVS_NETWORK_ID=""  # Network ID corresponding to POWERVS_NETWORK_NAME
POWERVS_SSH_KEY_NAME=""

# CAA instance spec
POWERVS_MEMORY="4"
POWERVS_PROCESSORS="0.25"
POWERVS_PROCESSOR_TYPE="shared"
POWERVS_SYSTEM_TYPE="s922"

# Kind cluster configuration (BYOM-style local cluster)
CLUSTER_NAME="peer-pods-e2e"
WORKER_NODE_NAME=""           # Defaults to "{CLUSTER_NAME}-worker" if empty
CONTAINER_RUNTIME="containerd"
KIND_CONFIG_FILE="../../byom/e2e/kind-config.yaml"

# SSH keys used by CAA to reach peer-pod VMs
SSH_SECRET_PRIV_KEY_PATH="/root/.ssh/id_rsa"
SSH_SECRET_PUB_KEY_PATH="/root/.ssh/id_rsa.pub"
SSH_USERNAME="peerpod"

# BYOM pool (leave empty — ibmcloud_powervs does not auto-create containers)
VM_POOL_IPS=""
POOL_SIZE="1"

# Docker / kind network
DOCKER_HOST="unix:///var/run/docker.sock"
DOCKER_NETWORK_NAME="kind"
