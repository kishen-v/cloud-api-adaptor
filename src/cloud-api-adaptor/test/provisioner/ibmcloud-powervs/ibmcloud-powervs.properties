IBMCLOUD_API_KEY="" # Can either be set here or be injected as an environment variable.
POWERVS_ZONE=""
POWERVS_SERVICE_INSTANCE_ID=""
POWERVS_IMAGE_ID=""    # Peer-pod VM image ID in the PowerVS workspace
POWERVS_NETWORK_ID=""  # Network ID corresponding to POWERVS_NETWORK_NAME
POWERVS_SSH_KEY_NAME=""

# CAA instance spec
POWERVS_MEMORY="4"
POWERVS_PROCESSORS="0.25"
POWERVS_PROCESSOR_TYPE="shared"
POWERVS_SYSTEM_TYPE="s922"

# Kind cluster configuration (BYOM-style local cluster)
CLUSTER_NAME="peer-pods-e2e"

# Kind cluster configuration file path (relative to the go test working directory, i.e. src/cloud-api-adaptor/test/e2e/, or absolute path)
KIND_CONFIG_FILE="../../test/provisioner/ibmcloud-powervs/kind-config.yaml"

# To reflect from: src/cloud-api-adaptor/install/charts/peerpods/providers/ibmcloudpowervs.yaml
CLOUD_PROVIDER="ibmcloud-powervs"
PROXY_TIMEOUT="10m"
USE_PUBLIC_IP="true"
FORWARDER_PORT="2005"
